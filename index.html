<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mr. GREEN PEST CONTROL CO.,LTD</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          fontSize: {
            xs: '0.75rem',
            sm: '0.875rem',
            base: '1rem',
            lg: '1.125rem',
            xl: '1.25rem',
            '2xl': '1.5rem',
            '3xl': '1.875rem',
            '4xl': '2.25rem',
            '5xl': '3rem',
          },
          extend: {
            colors: {
              primary: {
                DEFAULT: '#08a93d',
                light: '#0ACF4C',
                dark: '#068A31',
              },
              secondary: '#475569', // slate-600
              accent: '#f77727', // Custom Orange
              success: '#16a34a', // green-600
              warning: '#facc15', // yellow-400
              danger: '#dc2626', // red-600
            },
            fontFamily: {
              sans: ['"Noto Sans Thai"', 'sans-serif'],
            },
            lineHeight: {
              custom: '1.6',
            },
          },
        },
      };
    </script>
    <style>
      /* Custom Checkbox and Radio Styles */
      input[type='checkbox'],
      input[type='radio'] {
        -webkit-appearance: none;
        -moz-appearance: none;
        appearance: none;
        padding: 0;
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
        display: inline-block;
        vertical-align: middle;
        background-origin: border-box;
        -webkit-user-select: none;
        -moz-user-select: none;
        -ms-user-select: none;
        user-select: none;
        flex-shrink: 0;
        height: 1.25rem;
        width: 1.25rem;
        color: #08a93d; /* primary color */
        background-color: #fff;
        border-color: #6b7280; /* gray-500 */
        border-width: 1px;
      }

      input[type='checkbox'] {
        border-radius: 0.25rem; /* rounded */
      }

      input[type='radio'] {
        border-radius: 9999px; /* rounded-full */
      }

      input[type='checkbox']:focus,
      input[type='radio']:focus {
        outline: 2px solid transparent;
        outline-offset: 2px;
        --tw-ring-inset: var(--tw-empty, /*!*/ /*!*/);
        --tw-ring-offset-width: 2px;
        --tw-ring-offset-color: #fff;
        --tw-ring-color: #08a93d; /* primary color */
        --tw-ring-offset-shadow: var(--tw-ring-inset) 0 0 0
          var(--tw-ring-offset-width) var(--tw-ring-offset-color);
        --tw-ring-shadow: var(--tw-ring-inset) 0 0 0
          calc(2px + var(--tw-ring-offset-width)) var(--tw-ring-color);
        box-shadow:
          var(--tw-ring-offset-shadow), var(--tw-ring-shadow),
          var(--tw-shadow, 0 0 #0000);
        border-color: #08a93d;
      }

      input[type='checkbox']:checked,
      input[type='radio']:checked {
        border-color: transparent;
        background-color: currentColor;
        background-size: 100% 100%;
        background-position: center;
        background-repeat: no-repeat;
      }

      input[type='checkbox']:checked {
        background-image: url("data:image/svg+xml,%3csvg viewBox='0 0 16 16' fill='white' xmlns='http://www.w3.org/2000/svg'%3e%3cpath d='M12.207 4.793a1 1 0 010 1.414l-5 5a1 1 0 01-1.414 0l-2-2a1 1 0 011.414-1.414L6.5 9.086l4.293-4.293a1 1 0 011.414 0z'/%3e%3c/svg%3e");
      }

      input[type='radio']:checked {
        background-image: url("data:image/svg+xml,%3csvg viewBox='0 0 16 16' fill='white' xmlns='http://www.w3.org/2000/svg'%3e%3ccircle cx='8' cy='8' r='3'/%3e%3c/svg%3e");
      }

      /* Custom Disabled/Readonly Input Styles */
      input:disabled,
      textarea:disabled,
      select:disabled,
      input[readonly],
      textarea[readonly] {
        background-color: #f1f5f9; /* slate-100 */
        color: #64748b; /* slate-500 */
        cursor: not-allowed;
        opacity: 1; /* Override browser default opacity for better readability */
      }

      /* Custom Date Picker Icon Color */
      input[type='date']::-webkit-calendar-picker-indicator {
        color: #475569; /* slate-600 */
        opacity: 0.75;
        cursor: pointer;
        transition: opacity 0.2s ease-in-out;
      }

      input[type='date']::-webkit-calendar-picker-indicator:hover {
        opacity: 1;
      }
    </style>
  </head>
  <body class="bg-slate-100 antialiased leading-custom">
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
